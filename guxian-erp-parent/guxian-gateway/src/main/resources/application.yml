server:
  port: 8080
spring:
  application:
    name: guxian-gateway
  # 强制网关使用响应式环境，杜绝SpringMVC冲突
  main:
    web-application-type: reactive
    allow-bean-definition-overriding: true
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848


      config:
        server-addr: 127.0.0.1:8848
        import-check:
          enabled: false # 核心修复行
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: "*"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers: "*"
            allow-credentials: false
      routes:
        # 说明：
        #  1. 各服务自身已带模块前缀（/system、/customer、/sales），因此**不能**再配 StripPrefix，
        #     否则会转发成 /login/doLogin 这类路径导致 404；
        #  2. uri 端口必须与各服务 application.yml 的 server.port 一致：
        #     system=8081、customer=8082、sales=8083；
        #  3. 尚未实现的模块（供应商/采购/库存/生产/财务/报表/小程序）先占用规划端口，
        #     服务未启动时该前缀会转发失败（Connection refused），属预期。
        # 1.系统模块 system
        - id: guxian-system
          uri: lb://guxian-system
          predicates:
            - Path=/system/**

        # 2.客户模块 customer
        - id: guxian-customer
          uri: lb://guxian-customer
          predicates:
            - Path=/customer/**

        # 3.销售订单模块 sales
        - id: guxian-sales
          uri: lb://guxian-sales
          predicates:
            - Path=/sales/**

        # 7.供应商模块 supplier（未实现）
        - id: guxian-supplier
          uri: lb://guxian-supplier
          predicates:
            - Path=/supplier/**

        # 5.生产模块 produce（服务前缀为 /production/**，注意不是 /produce/**）
        - id: guxian-produce
          uri: lb://guxian-produce
          predicates:
            - Path=/production/**

        # 6.采购 purchase（未实现）
        - id: guxian-purchase
          uri: lb://guxian-purchase
          predicates:
            - Path=/purchase/**

        # 4.库存 stock（未实现）
        - id: guxian-stock
          uri: lb://guxian-stock
          predicates:
            - Path=/stock/**

        # 8.财务 finance（未实现）
        - id: guxian-finance
          uri: lb://guxian-finance
          predicates:
            - Path=/finance/**

        # 9.报表 report（未实现）
        - id: guxian-report
          uri: lb://guxian-report
          predicates:
            - Path=/report/**

        # 10.小程序 mini-api（未实现）
        - id: guxian-mini-api
          uri: lb://guxian-mini-api
          predicates:
            - Path=/mini/**

# 全链路日志追踪（Micrometer Tracing + Zipkin，traceId 贯穿所有微服务）
management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:0.1}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://127.0.0.1:9411/api/v2/spans}

logging:
  pattern:
    level: "%5p [${spring.application.name:-},%X{traceId:-},%X{spanId:-}]"
