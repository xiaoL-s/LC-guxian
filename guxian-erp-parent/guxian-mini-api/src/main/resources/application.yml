server:
  port: 8086
  address: 0.0.0.0

spring:
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  application:
    name: guxian-mini-api
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/guxian-erp?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

# 业务服务直连地址 + JWT配置（合并到一个 guxian 节点）
guxian:
  produce:
    base-url: http://127.0.0.1:8085
  system:
    base-url: http://127.0.0.1:8081
  jwt:
    secret: ${JWT_SECRET:GuxianErpSecretKey20260801SecretKeyLong123456789}
    expire-hours: 720

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.guxian.mini.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

# 全链路日志追踪（Micrometer Tracing + Zipkin，traceId 贯穿所有微服务）
management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://127.0.0.1:9411/api/v2/spans

logging:
  pattern:
    level: "%5p [${spring.application.name:-},%X{traceId:-},%X{spanId:-}]"
