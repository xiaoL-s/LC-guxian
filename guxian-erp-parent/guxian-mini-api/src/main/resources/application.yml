server:
  port: 8086
  address: 0.0.0.0

spring:
  application:
    name: guxian-mini-api
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/guxian-erp?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root

# 业务服务直连地址 + JWT配置（合并到一个 guxian 节点）
guxian:
  produce:
    base-url: http://127.0.0.1:8085
  system:
    base-url: http://127.0.0.1:8081
  jwt:
    secret: GuxianErpSecretKey20260801SecretKeyLong123456789
    expire-hours: 720

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.guxian.mini.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
